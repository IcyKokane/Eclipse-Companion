name: Eclipse Companion Android debug
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runners provide Android command-line tools; do not request the obsolete 'tools' SDK package.
      - name: Install SDK and native build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download local inference engine sources (build time only)
        run: bash scripts/setup-llama.sh
      - name: Record inference engine revision
        run: cat LLAMA_COMMIT.txt
      - name: Source and companion logic checks
        run: |
          python3 scripts/audit-source.py
      - name: Owner release identity and signature policy tests
        run: |
          python3 -m py_compile scripts/verify-release.py
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Native prefix-cache policy regression tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/native/prompt_cache_policy_test.cpp -o /tmp/eclipse-cache-policy
          /tmp/eclipse-cache-policy
      - name: JVM logic tests + debug APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK payload and offline permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libeclipse_jni.so'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'package: name=' | tee apk-metadata.txt
          grep -q 'dev.privatecompanion.eclipse.preview51' apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'application-label:.*Eclipse CPU Test 0.5.1'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCompanion-v0.5.1-cpu-tuning-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
