name: Eclipse Companion owner-signed Android release

# Never execute signing from PR code, forks, push events, or automated schedules.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type SIGN to make an owner-signed v0.5.0 alpha APK from main'
        type: string
        required: true

jobs:
  owner_signed_release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == 'SIGN'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require owner-controlled signing secrets and pinned certificate
        env:
          ECLIPSE_KEYSTORE_B64: ${{ secrets.ECLIPSE_KEYSTORE_B64 }}
          ECLIPSE_STORE_PASSWORD: ${{ secrets.ECLIPSE_STORE_PASSWORD }}
          ECLIPSE_KEY_ALIAS: ${{ secrets.ECLIPSE_KEY_ALIAS }}
          ECLIPSE_KEY_PASSWORD: ${{ secrets.ECLIPSE_KEY_PASSWORD }}
          ECLIPSE_CERT_SHA256: ${{ vars.ECLIPSE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ECLIPSE_KEYSTORE_B64 ECLIPSE_STORE_PASSWORD ECLIPSE_KEY_ALIAS ECLIPSE_KEY_PASSWORD ECLIPSE_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing owner signing configuration: $name"
              exit 1
            fi
          done
          python3 -c 'import os, re; s=re.sub(r"[:\\s]", "", os.environ["ECLIPSE_CERT_SHA256"]); assert re.fullmatch(r"[0-9a-fA-F]{64}", s), "Invalid owner certificate pin"'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and native build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare verified offline source and unsigned release APK
        run: |
          set -euo pipefail
          bash scripts/setup-llama.sh
          python3 scripts/audit-source.py
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/native/prompt_cache_policy_test.cpp -o /tmp/eclipse-cache-policy
          /tmp/eclipse-cache-policy
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Sign with owner key (never committed, never uploaded)
        env:
          ECLIPSE_KEYSTORE_B64: ${{ secrets.ECLIPSE_KEYSTORE_B64 }}
          ECLIPSE_STORE_PASSWORD: ${{ secrets.ECLIPSE_STORE_PASSWORD }}
          ECLIPSE_KEY_ALIAS: ${{ secrets.ECLIPSE_KEY_ALIAS }}
          ECLIPSE_KEY_PASSWORD: ${{ secrets.ECLIPSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .owner-signing dist
          trap 'rm -f .owner-signing/*' EXIT
          printf '%s' "$ECLIPSE_KEYSTORE_B64" | base64 --decode > .owner-signing/owner.p12
          test -s .owner-signing/owner.p12
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" .owner-signing/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks .owner-signing/owner.p12 --ks-type PKCS12 \
            --ks-key-alias "$ECLIPSE_KEY_ALIAS" \
            --ks-pass env:ECLIPSE_STORE_PASSWORD \
            --key-pass env:ECLIPSE_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/EclipseCompanion-v0.5.0-owner-signed.apk \
            .owner-signing/aligned.apk
          test -s dist/EclipseCompanion-v0.5.0-owner-signed.apk

      - name: Verify owner signature, version, offline permissions, and ARM64 engine
        env:
          ECLIPSE_CERT_SHA256: ${{ vars.ECLIPSE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=dist/EclipseCompanion-v0.5.0-owner-signed.apk
          python3 scripts/verify-release.py \
            --apk "$APK" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --version-code 14 --version-name 0.5.0 \
            --cert-sha256 "$ECLIPSE_CERT_SHA256"
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Upload verified owner-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCompanion-v0.5.0-owner-signed
          path: |
            dist/EclipseCompanion-v0.5.0-owner-signed.apk
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified private-repository prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.5.0-alpha1 \
            dist/EclipseCompanion-v0.5.0-owner-signed.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Eclipse Companion V0.5.0 — Owner-signed alpha" \
            --notes "Owner-signed offline Android alpha. Installs as dev.privatecompanion.eclipse. Future releases must use this exact signing certificate and a higher versionCode. Does not automatically migrate preview41–preview49 data. Keep the original key and backup safe." \
            --prerelease
